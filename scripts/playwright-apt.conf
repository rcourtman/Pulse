// Browser OS dependencies come from the hosted Ubuntu runner's existing
// distribution definition. Preserve its mirrors and Signed-By settings while
// keeping unrelated vendor feeds outside this acquisition. Do not disable
// TLS/signatures or accept an incomplete Ubuntu index as success.
Dir::Etc::sourcelist "/etc/apt/sources.list.d/ubuntu.sources";
Dir::Etc::sourceparts "-";
APT::Update::Pre-Invoke:: "test -r /etc/apt/sources.list.d/ubuntu.sources && test -s /etc/apt/sources.list.d/ubuntu.sources";
Acquire::http::Timeout "30";
Acquire::https::Timeout "30";
Acquire::Retries "2";
APT::Update::Error-Mode "any";
