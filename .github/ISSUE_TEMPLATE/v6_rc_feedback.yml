name: Pulse v6 pre-release feedback
description: Report v6 pre-release bugs, regressions, upgrade issues, or actionable UX feedback
title: "[v6 pre-release]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for actionable Pulse v6 pre-release feedback.

        For general impressions or smaller notes, use the pinned v6 pre-release feedback hub.
        Give the version on the affected running instance, or the version or release asset attempted if installation never completed. For a running container (Docker, Compose, or Kubernetes), include the Pulse image tag or digest; non-container installs do not need an image reference. Do not repeat an action just to fill in this form if it could cause data loss, an outage, duplicate changes, or excessive notifications; describe the original sequence instead.

        For connection or data failures, only collect diagnostics if Pulse is running and collection is safe. **Run Diagnostics** can make live API and guest-agent requests; do not run it during backups, freeze/thaw or an unresponsive-host incident just to file a report. Prefer existing observations; if a result is already displayed, its GitHub export downloads that result without running checks again.

        Anything you attach here is public. Review files and screenshots locally before posting, even when an export is labelled "sanitized". Remove credentials, session cookies, secret URLs, private host/network and personal details, including text echoed in errors. Do not attach full/private diagnostics, .env or configuration files, private keys, Copy as cURL commands or full network exports.

  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - Bug / regression
        - Upgrade / migration issue
        - UX / workflow friction
        - Performance issue
        - Documentation issue
        - Other actionable feedback
    validations:
      required: true

  - type: input
    id: pulse_version
    attributes:
      label: Pulse version
      description: Running version for an existing install; for a failed install, the exact version or release asset attempted, or "unknown" if it was not shown.
      placeholder: v6.x.y-rc.N, release asset name, or unknown
    validations:
      required: true

  - type: input
    id: previous_version
    attributes:
      label: Last known working Pulse version
      description: If you already observed the same behaviour working, give that version. The version before an upgrade is not necessarily a working baseline. Leave blank or write "unknown" if not known; do not downgrade, restart or repeat the action to find out.
      placeholder: v6.x.y or unknown
    validations:
      required: false

  - type: input
    id: agent_version
    attributes:
      label: Agent version
      description: Running version of the affected agent, separately from the Pulse server; write "none" for an API-only connection or "unknown" if unavailable. Do not reinstall or re-enrol an agent to find out.
      placeholder: v6.x.y, none, or unknown
    validations:
      required: false

  - type: input
    id: image_ref
    attributes:
      label: Running Pulse container image tag or digest
      description: For a running Docker, Compose, or Kubernetes container, give its exact Pulse image tag or digest. Leave blank for LXC, bare metal, and failed installs that never started; put an attempted release asset in Pulse version instead.
      placeholder: rcourtman/pulse:v6.x.y-rc.N or rcourtman/pulse@sha256:...

  - type: dropdown
    id: install_path
    attributes:
      label: Install path
      description: How you reached the affected version; an upgrade path alone does not establish that the previous version worked.
      options:
        - Clean v6 install
        - Upgrade from v5
        - Upgrade from a stable v6 release
        - Upgrade from an earlier v6 prerelease
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: installation_type
    attributes:
      label: Installation type
      description: How the Pulse server is installed, not the kind of workload being monitored.
      options:
        - Docker
        - Docker Compose
        - ProxmoxVE LXC
        - Kubernetes / Helm
        - Bare metal / systemd
        - Other
    validations:
      required: true

  - type: input
    id: installer_source
    attributes:
      label: Installer or helper source
      description: For a failed install, give the public installer/helper URL or command name, if known. Do not paste a command containing a token or other secret.
      placeholder: Official Pulse installer, helper URL, or command name
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: OS / environment
      description: Pulse server OS and, for platform-specific failures, the affected monitored platform and its release where known (for example, Proxmox VE 9.2 or TrueNAS SCALE 26 / CORE 13). Say whether the affected readings use the platform API, a Pulse agent, or both; keep this separate from the Pulse server's installation and version. Use existing settings or observations; leave blank or write "unknown" if unavailable. Do not run diagnostics, probe, restart or change a connection just to answer.
      placeholder: Pulse on Debian 13; TrueNAS CORE 13.0-U6.1 via API, no Pulse agent
    validations:
      required: false

  - type: dropdown
    id: license_tier
    attributes:
      label: License tier
      options:
        - Community / Free
        - Relay
        - Pro
        - Pro+
        - Cloud
        - MSP
        - Enterprise
        - Not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: |
        Describe the problem, friction, or feedback and where you see it. Distinguish the affected target (for example, a VM, LXC, Docker container, NAS or Pulse itself) from how the Pulse server is installed.
        For missing readings, say whether the affected workload's usual UI was still responsive when the problem occurred. Use existing observations; write "unknown" if you cannot safely tell. Do not run another update, backup or guest-agent probe just to answer.

        For reports involving several hosts or clusters, say which nodes share a cluster, which belong to independent installations, whether node names or guest IDs (VMIDs) repeat, and whether they share a backup destination.
        Use consistent aliases for private names and addresses across the description, screenshots and logs; preserve which values repeat (for example, cluster A/node 1 and standalone B/node 1). Use existing observations, or write "unknown"; do not add, rename, remove or re-enrol anything just to answer.
      placeholder: Pulse upgraded cleanly, but the new storage filters are hard to understand and I could not find the previous view quickly.
    validations:
      required: true

  - type: textarea
    id: reproduce_or_context
    attributes:
      label: Steps or original sequence / usage context
      description: For a bug, describe what happened before it. If repeating it is unsafe or impossible, say so; a second reproduction is not required. For workflow feedback, describe what you were trying to do.
      placeholder: |
        1. I upgraded to the current v6 RC build
        2. I opened ...
        3. I saw ...
        4. I have not repeated it because ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: What did you expect instead?
      placeholder: I expected ...
    validations:
      required: true

  - type: textarea
    id: additional_topics
    attributes:
      label: Additional actionable topics
      description: Enter "None" for a single topic. If this report also raises another bug, feature, or workflow, list each topic here; triage will preserve it with a separate linked disposition.
      placeholder: None
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or diagnostics
      description: |
        Attach screenshots or paste relevant redacted logs if useful. For connection or data failures, a reviewed GitHub diagnostics export can help; prefer existing evidence when new collection is unsafe.
        Review files and screenshots locally; remove secrets and identifying details, including those echoed in errors, before attaching them here.

        For notification reports, distinguish an already-observed **Test** result from ordinary alert delivery: single, grouped/digest or resolved. Give the destination type (such as email or Telegram), built-in or custom template, original time and redacted error or missing host/resource context where known. A successful Test does not establish ordinary delivery or correct identity.
        Use existing messages and queue details only; blank or "unknown" is valid. Do not send a Test, trigger an alert, retry/replay a queued message, clear the queue or change notification settings just to complete this report. Keep destination addresses, webhook URLs, chat IDs, tokens and full notification settings or payloads private.

        For CPU, memory or disk-write reports, use existing readings or safe, passive observations. Say whether the reading covers the Pulse process, its container or the whole host, and give its units, measurement window and uptime. Include allocated CPUs or memory limit, fleet size, polling interval and open dashboards where relevant and known. A process-start CPU average is not a recent sampling window; database size is not a write rate.
        Existing screenshots are useful; write "unavailable" when safe collection is not possible. Do not restart, create load or change polling or retention just to measure. Do not attach raw profiles, heap dumps, databases or full process command lines; summarise only relevant counters after local review.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I gave the running Pulse version, or for an install that never started, the attempted version or "unknown"; for a running container I also gave its Pulse image tag or digest.
          required: true
        - label: I searched existing issues and the pinned v6 pre-release feedback hub first.
          required: true
