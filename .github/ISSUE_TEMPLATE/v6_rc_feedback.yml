name: Pulse v6 pre-release feedback
description: Report v6 pre-release bugs, regressions, upgrade issues, or actionable UX feedback
title: "[v6 pre-release]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for actionable Pulse v6 pre-release feedback.

        For general impressions or smaller notes, use the pinned v6 pre-release feedback hub.
        Give the version on the affected running instance, or the version or release asset attempted if installation never completed. For a running container (Docker, Compose, or Kubernetes), include the Pulse image tag or digest; non-container installs do not need an image reference. Do not repeat an action just to fill in this form if it could cause data loss, an outage, duplicate changes, or excessive notifications; describe the original sequence instead.

        For connection or data failures, only collect diagnostics if Pulse is running and collection is safe. **Run Diagnostics** can make live API and guest-agent requests; do not run it during backups, freeze/thaw or an unresponsive-host incident just to file a report. Prefer existing observations; if a result is already displayed, its GitHub export downloads that result without running checks again.

        Anything you attach here is public. Review files and screenshots locally before posting, even when an export is labelled "sanitized". Remove credentials, session cookies, secret URLs, private host/network and personal details, including text echoed in errors. Do not attach full/private diagnostics, .env or configuration files, private keys, Copy as cURL commands or full network exports.

  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - Bug / regression
        - Upgrade / migration issue
        - UX / workflow friction
        - Performance issue
        - Documentation issue
        - Other actionable feedback
    validations:
      required: true

  - type: input
    id: pulse_version
    attributes:
      label: Pulse version
      description: Running version for an existing install; for a failed install, the exact version or release asset attempted, or "unknown" if it was not shown.
      placeholder: v6.0.0-rc.N, release asset name, or unknown
    validations:
      required: true

  - type: input
    id: image_ref
    attributes:
      label: Running Pulse container image tag or digest
      description: For a running Docker, Compose, or Kubernetes container, give its exact Pulse image tag or digest. Leave blank for LXC, bare metal, and failed installs that never started; put an attempted release asset in Pulse version instead.
      placeholder: rcourtman/pulse:v6.0.0-rc.N or rcourtman/pulse@sha256:...

  - type: dropdown
    id: install_path
    attributes:
      label: Install path
      options:
        - Clean v6 install
        - Upgrade from v5
        - Upgrade from an earlier v6 prerelease
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: installation_type
    attributes:
      label: Installation type
      options:
        - Docker
        - Docker Compose
        - ProxmoxVE LXC
        - Kubernetes / Helm
        - Bare metal / systemd
        - Other
    validations:
      required: true

  - type: input
    id: installer_source
    attributes:
      label: Installer or helper source
      description: For a failed install, give the public installer/helper URL or command name, if known. Do not paste a command containing a token or other secret.
      placeholder: Official Pulse installer, helper URL, or command name
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: OS / environment
      description: Host OS, distro, or environment details that matter to the report.
      placeholder: Ubuntu 24.04, Debian 12, Unraid 7, Proxmox 8, macOS 15
    validations:
      required: true

  - type: dropdown
    id: license_tier
    attributes:
      label: License tier
      options:
        - Community / Free
        - Relay
        - Pro
        - Pro+
        - Cloud
        - MSP
        - Enterprise
        - Not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem, friction, or feedback clearly and directly.
      placeholder: Pulse upgraded cleanly, but the new storage filters are hard to understand and I could not find the previous view quickly.
    validations:
      required: true

  - type: textarea
    id: reproduce_or_context
    attributes:
      label: Steps or original sequence / usage context
      description: For a bug, describe what happened before it. If repeating it is unsafe or impossible, say so; a second reproduction is not required. For workflow feedback, describe what you were trying to do.
      placeholder: |
        1. I upgraded to the current v6 RC build
        2. I opened ...
        3. I saw ...
        4. I have not repeated it because ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: What did you expect instead?
      placeholder: I expected ...
    validations:
      required: true

  - type: textarea
    id: additional_topics
    attributes:
      label: Additional actionable topics
      description: Enter "None" for a single topic. If this report also raises another bug, feature, or workflow, list each topic here; triage will preserve it with a separate linked disposition.
      placeholder: None
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or diagnostics
      description: |
        Attach screenshots or paste relevant redacted logs if useful. For connection or data failures, a reviewed GitHub diagnostics export can help; prefer existing evidence when new collection is unsafe.
        Review files and screenshots locally; remove secrets and identifying details, including those echoed in errors, before attaching them here.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I gave the running Pulse version, or for an install that never started, the attempted version or "unknown"; for a running container I also gave its Pulse image tag or digest.
          required: true
        - label: I searched existing issues and the pinned v6 pre-release feedback hub first.
          required: true
