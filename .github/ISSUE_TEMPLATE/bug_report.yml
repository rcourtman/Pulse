name: Bug report
description: Report a bug or unexpected outcome with version details
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report the version on the running instance where the bug occurs, not just the version you upgraded from. If installation failed before Pulse could start, give the exact version you tried to install, or write "unknown" and identify the installer or helper below. For container installs, include the running image tag or digest; for other installs, leave the image field blank.

        If repeating the action could cause data loss, an outage, duplicate changes, or excessive notifications, do not repeat it just to fill in this form. Describe the original sequence and what you observed instead.

        For connection or data failures, only collect diagnostics if Pulse is running and collection is safe. **Run Diagnostics** can make live API and guest-agent requests; do not run it during backups, freeze/thaw or an unresponsive-host incident just to file a report. Prefer existing observations; if a result is already displayed, its GitHub export downloads that result without running checks again.

        Anything you attach here is public. Review files and screenshots locally before posting, even when an export is labelled "sanitized". Remove credentials, session cookies, secret URLs, private host/network and personal details, including text echoed in errors. Do not attach full/private diagnostics, .env or configuration files, private keys, Copy as cURL commands or full network exports.

        If a credential has already been posted, revoke it with its issuer and remove the public copy; editing a post is not revocation or proof that every copy is gone. Do not repost the original evidence; use the [private security disclosure route](https://github.com/rcourtman/Pulse/security/policy) for sensitive details.

  - type: markdown
    attributes:
      value: |
        <details>
        <summary>Several hosts or clusters: preserve which names and IDs repeat</summary>

        For reports involving several hosts or clusters, say which nodes share a cluster, which belong to independent installations, whether node names or guest IDs (VMIDs) repeat, and whether they share a backup destination.
        Use consistent aliases for private names and addresses across the description, screenshots and logs; preserve which values repeat (for example, cluster A/node 1 and standalone B/node 1). Use existing observations, or write "unknown"; do not add, rename, remove or re-enrol anything just to answer.

        </details>

        <details>
        <summary>Dashboard stuck or readings stopped</summary>

        Say whether you saw **Connecting to Pulse** or the dashboard opened but readings stopped changing. If known, give the last time you saw fresh readings and its time zone. Say whether one source or several stopped, whether any agent's **Last seen** time advanced, or whether new alerts appeared.

        If you already have a Pulse health check from the same time, give only its status. HTTP 200 means Pulse answered, not that it was collecting data. Use what you saw or write "unknown". Do not run Diagnostics, restart Pulse or take a process dump just to report it. Keep full responses, network exports and dumps private.

        </details>

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: |
        What is broken, where do you see it, and what is the impact? Distinguish the affected target (for example, a VM, LXC, Docker container, NAS or Pulse itself) from how the Pulse server is installed.
        For missing readings, say whether the affected workload's usual UI was still responsive when the problem occurred. Use existing observations; write "unknown" if you cannot safely tell. Do not run another update, backup or guest-agent probe just to answer.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps or original sequence
      description: Describe what happened before the failure. If repeating it is unsafe or impossible, say so; a second reproduction is not required.
      placeholder: |
        1. Before the failure, I ...
        2. I then saw ...
        3. I have not repeated it because ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: additional_topics
    attributes:
      label: Additional actionable topics
      description: Enter "None" for a single bug. If this report also raises another bug, feature, or workflow, list each topic here; triage will preserve it with a separate linked disposition.
      placeholder: None
    validations:
      required: true

  - type: input
    id: pulse_version
    attributes:
      label: Pulse version
      description: Version running when the problem occurred, or "unknown" if unavailable. For a failed install, give the exact version or release asset attempted. Keep an interrupted upgrade's target and later recovered version separate in Upgrade attempt and recovery below.
      placeholder: v6.x.y, release asset name, or unknown
    validations:
      required: true

  - type: input
    id: previous_version
    attributes:
      label: Last known working Pulse version
      description: If you already observed the same behaviour working, give that version. The version before an upgrade is not necessarily a working baseline. Leave blank or write "unknown" if not known; do not downgrade, restart or repeat the action to find out.
      placeholder: v6.x.y or unknown
    validations:
      required: false

  - type: input
    id: agent_version
    attributes:
      label: Agent version
      description: Running version of the affected agent, separately from the Pulse server; write "none" for an API-only connection or "unknown" if unavailable. Do not reinstall or re-enrol an agent to find out.
      placeholder: v6.x.y, none, or unknown
    validations:
      required: true

  - type: input
    id: image_ref
    attributes:
      label: Image tag or digest
      description: For container installs, the exact image reference used by the running container. Leave blank for LXC, bare metal, and other non-container installs.
      placeholder: rcourtman/pulse:v6.x.y or rcourtman/pulse@sha256:...
    validations:
      required: false

  - type: dropdown
    id: install_type
    attributes:
      label: Installation type
      description: How the Pulse server is installed, not the kind of workload being monitored.
      options:
        - Docker
        - Docker Compose
        - ProxmoxVE LXC
        - Kubernetes / Helm
        - Bare metal / systemd
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS / environment
      description: Pulse server OS and, for platform-specific failures, the affected monitored platform and its release where known (for example, Proxmox VE 9.2 or TrueNAS SCALE 26 / CORE 13). Say whether the affected readings use the platform API, a Pulse agent, or both; keep this separate from the Pulse server's installation and version. Use existing settings or observations; leave blank or write "unknown" if unavailable. Do not run diagnostics, probe, restart or change a connection just to answer.
      placeholder: Pulse on Debian 13; TrueNAS CORE 13.0-U6.1 via API, no Pulse agent
    validations:
      required: false

  - type: input
    id: installer_source
    attributes:
      label: Installer or helper source
      description: For a failed install or upgrade, give the public installer/helper URL or command name, if known. Do not paste a command containing a token or other secret.
      placeholder: Official Pulse installer, helper URL, or command name
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <details>
        <summary>Failed upgrade: which attempt, stop and recovery?</summary>

        For an interrupted or failed upgrade only: give the starting version, intended version or asset, route (in-app, automatic timer, manual installer or helper), original time and timezone, and last recorded updater/installer result or exit code. Distinguish Pulse stopping from the whole LXC, VM or host stopping. Say what recovery you already performed and which version and state you observed afterwards.
        A verified download signature is not a completed upgrade; a later boot does not explain the stop. Today's running version does not establish the version at failure. Use existing observations; blank or "unknown" is valid. If already available, include only relevant, locally reviewed and redacted updater and host stop records in the evidence field, not full journals.
        Do not rerun the update, reboot, restore, run Diagnostics or delete rollback backups just to complete this report. Keep backups private and preserve the original evidence.

        </details>

  - type: textarea
    id: upgrade_context
    attributes:
      label: Upgrade attempt and recovery
      description: |
        For failed or interrupted upgrades only. Use the original attempt, stop and recovery already observed; blank or "unknown" is valid. Do not repeat the update or delete rollback backups.
      placeholder: |
        Attempt: starting version → intended version; route; time and timezone
        Last recorded result: error or exit code, or unknown
        Observed stop: Pulse service / whole LXC, VM or host / unknown
        Recovery already performed: none or original steps; version/state afterwards or unknown
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Optional: use existing observations.

        <details>
        <summary>Notification delivery: Test versus ordinary alerts</summary>

        For notification reports, distinguish an already-observed **Test** result from ordinary alert delivery: single, grouped/digest or resolved. Give the destination type (such as email or Telegram), built-in or custom template, original time and redacted error or missing host/resource context where known. A successful Test does not establish ordinary delivery or correct identity.
        Use existing messages and queue details only; blank or "unknown" is valid. Do not send a Test, trigger an alert, retry/replay a queued message, clear the queue or change notification settings just to complete this report. Keep destination addresses, webhook URLs, chat IDs, tokens and full notification settings or payloads private.

        </details>

        <details>
        <summary>Proxmox backups: what to report</summary>

        Say where the readings disagree: **Backup jobs**, **By date**, **Coverage** or a backup-age alert. Use consistent aliases for the connection, guest and storage location, especially if guest IDs repeat. If you already have them, give the task result and time, the restore point's creation time and the backup age Pulse shows. Use the original time zone.

        If a guest stayed unresponsive after the backup, say what you already saw about thaw, fresh successful writes on every filesystem covered by the backup, and whether the workload responded. An **OK** task does not prove the guest recovered.

        Use existing evidence or write "unknown". Do not repeat a backup, verify or restore a point, run Diagnostics or send guest-agent probes for this report. Do not force writes or reset the guest. Keep full task IDs, private paths, inventories and unredacted errors private.

        </details>

        <details>
        <summary>Pulse CPU, memory or disk writes: comparable measurements</summary>

        If Pulse stopped, say whether the service or the whole container stopped. Give each stop's time and time zone, Pulse version and memory limit, if known. A high memory chart does not prove a kill. If you already have a kernel line naming Pulse as killed for lack of memory, share just that line after removing private details. Otherwise leave the cause unknown.

        For Pulse CPU, memory or disk writes, use existing readings, screenshots or passive checks. Give the scope (Pulse process, container or host), units, measurement window and uptime. Add known CPU limits, fleet size, polling interval and open dashboards. CPU averaged since start is not a recent sample. Database size is not a write rate.

        A higher steady memory baseline matters, even without growth. Compare readings at similar uptimes and workloads. Note the Pulse version and enabled collectors or features for each. Give the RAM and swap limits that applied to each reading, if known. Say if a limit changed and whether a peak covers the measurement window or the whole run.

        Write "unavailable" if you cannot measure safely. Do not restart, downgrade, add load or change limits, features, polling or retention to measure. Summarise reviewed counters, not raw profiles, heap dumps, databases or full process command lines.

        </details>

        <details>
        <summary>VM or LXC memory: guest versus hypervisor readings</summary>

        For VM or LXC memory disagreements, say where each existing reading appears (overview, History, alert, Patrol or another tool) and whether the comparison was measured inside the affected guest or on its hypervisor node. Give original times, units and memory source or sample age only if already known or displayed; use consistent private aliases and write "unknown" for missing details.
        Available memory, buff/cache and a process's RSS measure different things: RSS alone is not total guest usage, and a cache-inclusive hypervisor footprint does not establish guest pressure. A Proxmox VM API connection may still obtain QEMU guest-agent (QGA) readings without a Pulse agent.
        Use existing observations only. Do not run commands, Diagnostics or guest-agent probes, install an agent, change memory settings or workloads, or repeat a backup just to answer.

        </details>

        <details>
        <summary>Saved access or plans: failed read versus unconfirmed change</summary>

        For membership, invitation, role or plan problems, say which page or action failed and what you expected that account to be allowed to do. Use consistent aliases such as reader A and workspace B, not names, email addresses or account IDs.
        Distinguish loading saved access from submitting a change. Give the original time, HTTP status and redacted error only if already known. A failed read does not mean saved access was removed. A lost response can follow a saved invitation, role change, ownership transfer or activation.
        Keep any working administrator session open. Use existing observations; blank or "unknown" is valid. Do not run Diagnostics, reset passwords, widen permissions or repeat the change just to complete this report. Keep cookies, tokens, keys, permission exports and purchase or account evidence private. Use the [private security disclosure route](https://github.com/rcourtman/Pulse/security/policy) for suspected exposure or another workspace's private data, not a public reproduction. Keep payment and licence-ownership disputes in your private account/support conversation.

        </details>

        <details>
        <summary>Single sign-on: setup check versus a new sign-in</summary>

        Name the provider software (for example, Authentik with OIDC), not your private address. Say which step failed: saving the provider, its **Test** button, signing in at the provider, returning to Pulse, or getting the expected access after sign-in. A passing **Test** or a session that was already open does not show that a new sign-in works.

        If it broke after editing the provider, say what changed (for example, a role mapping) or whether you saved without changing anything. For OIDC, say whether you left the client secret field blank or entered a value, but never include the value. Give the original time and redacted error if known. Keep cookies, tokens, full return URLs and SAML responses private.

        Keep any working administrator session open. Use what you already saw or write "unknown". Do not sign out, save again, run **Test** or repeat the sign-in just to file this report.

        </details>

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or diagnostics
      description: |
        Add relevant redacted logs or a reviewed GitHub diagnostics export for connection and data failures; for visual failures, a screenshot or exact error may be enough. Prefer existing evidence when new collection is unsafe.
        Review files and screenshots locally; remove secrets and identifying details, including those echoed in errors, before attaching them here.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I gave the Pulse version at the failure or "unknown" if unavailable; for an install that never started, the attempted version or "unknown"; for a running container I also gave its image tag or digest.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
