name: Bug report
description: Report a bug or unexpected outcome with version details
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report the version on the running instance where the bug occurs, not just the version you upgraded from. If installation failed before Pulse could start, give the exact version you tried to install, or write "unknown" and identify the installer or helper below. For container installs, include the running image tag or digest; for other installs, leave the image field blank.

        If repeating the action could cause data loss, an outage, duplicate changes, or excessive notifications, do not repeat it just to fill in this form. Describe the original sequence and what you observed instead.

        For connection or data failures, only collect diagnostics if Pulse is running and collection is safe. **Run Diagnostics** can make live API and guest-agent requests; do not run it during backups, freeze/thaw or an unresponsive-host incident just to file a report. Prefer existing observations; if a result is already displayed, its GitHub export downloads that result without running checks again.

        Anything you attach here is public. Review files and screenshots locally before posting, even when an export is labelled "sanitized". Remove credentials, session cookies, secret URLs, private host/network and personal details, including text echoed in errors. Do not attach full/private diagnostics, .env or configuration files, private keys, Copy as cURL commands or full network exports.

  - type: textarea
    id: bug_description
    attributes:
      label: Describe the bug
      description: |
        What is broken, where do you see it, and what is the impact? Distinguish the affected target (for example, a VM, LXC, Docker container, NAS or Pulse itself) from how the Pulse server is installed.
        For missing readings, say whether the affected workload's usual UI was still responsive when the problem occurred. Use existing observations; write "unknown" if you cannot safely tell. Do not run another update, backup or guest-agent probe just to answer.
      placeholder: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps or original sequence
      description: Describe what happened before the failure. If repeating it is unsafe or impossible, say so; a second reproduction is not required.
      placeholder: |
        1. Before the failure, I ...
        2. I then saw ...
        3. I have not repeated it because ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: additional_topics
    attributes:
      label: Additional actionable topics
      description: Enter "None" for a single bug. If this report also raises another bug, feature, or workflow, list each topic here; triage will preserve it with a separate linked disposition.
      placeholder: None
    validations:
      required: true

  - type: input
    id: pulse_version
    attributes:
      label: Pulse version
      description: Running version for an existing install; for a failed install, the exact version or release asset attempted, or "unknown" if it was not shown.
      placeholder: v6.x.y, release asset name, or unknown
    validations:
      required: true

  - type: input
    id: previous_version
    attributes:
      label: Last known working Pulse version
      description: If you already observed the same behaviour working, give that version. The version before an upgrade is not necessarily a working baseline. Leave blank or write "unknown" if not known; do not downgrade, restart or repeat the action to find out.
      placeholder: v6.x.y or unknown
    validations:
      required: false

  - type: input
    id: agent_version
    attributes:
      label: Agent version
      description: Running version of the affected agent, separately from the Pulse server; write "none" for an API-only connection or "unknown" if unavailable. Do not reinstall or re-enrol an agent to find out.
      placeholder: v6.x.y, none, or unknown
    validations:
      required: true

  - type: input
    id: image_ref
    attributes:
      label: Image tag or digest
      description: For container installs, the exact image reference used by the running container. Leave blank for LXC, bare metal, and other non-container installs.
      placeholder: rcourtman/pulse:v6.x.y or rcourtman/pulse@sha256:...
    validations:
      required: false

  - type: dropdown
    id: install_type
    attributes:
      label: Installation type
      description: How the Pulse server is installed, not the kind of workload being monitored.
      options:
        - Docker
        - Docker Compose
        - ProxmoxVE LXC
        - Kubernetes / Helm
        - Bare metal / systemd
        - Other
    validations:
      required: true

  - type: input
    id: installer_source
    attributes:
      label: Installer or helper source
      description: For a failed install, give the public installer/helper URL or command name, if known. Do not paste a command containing a token or other secret.
      placeholder: Official Pulse installer, helper URL, or command name
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or diagnostics
      description: |
        Add relevant redacted logs or a reviewed GitHub diagnostics export for connection and data failures; for visual failures, a screenshot or exact error may be enough. Prefer existing evidence when new collection is unsafe.
        Review files and screenshots locally; remove secrets and identifying details, including those echoed in errors, before attaching them here.

        For CPU, memory or disk-write reports, use existing readings or safe, passive observations. Say whether the reading covers the Pulse process, its container or the whole host, and give its units, measurement window and uptime. Include allocated CPUs or memory limit, fleet size, polling interval and open dashboards where relevant and known. A process-start CPU average is not a recent sampling window; database size is not a write rate.
        Existing screenshots are useful; write "unavailable" when safe collection is not possible. Do not restart, create load or change polling or retention just to measure. Do not attach raw profiles, heap dumps, databases or full process command lines; summarise only relevant counters after local review.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I gave the running Pulse version, or for an install that never started, the attempted version or "unknown"; for a running container I also gave its image tag or digest.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
