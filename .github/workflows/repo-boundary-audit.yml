name: Repo Boundary Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify boundary dependency setup
        run: python3 scripts/repo-boundary-setup-regression.py

      - name: Install boundary audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            # ripgrep is in Ubuntu universe. Unrelated runner repositories must
            # not gate this audit, and their cached indexes must not supply it.
            apt_lists="$(mktemp -d "${RUNNER_TEMP}/boundary-apt-lists.XXXXXX")"
            chmod 0755 "$apt_lists"
            apt_options=(
              -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources
              -o Dir::Etc::sourceparts=-
              -o "Dir::State::lists=$apt_lists"
            )
            sudo apt-get "${apt_options[@]}" update --error-on=any
            sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends ripgrep
            rg --version
          fi

      - name: Verify shared reporting boundary exemption
        run: python3 scripts/repo-boundary-regression.py

      - name: Run Boundary Audit (report mode)
        run: |
          ./scripts/audit-private-boundary.sh | tee repo-boundary-audit.txt

      - name: Enforce API Import Boundary
        run: ./scripts/audit-private-boundary.sh --enforce-api-imports

      - name: Enforce API Root Import Boundary
        run: ./scripts/audit-private-boundary.sh --enforce-api-root-imports

      - name: Enforce Non-API Import Boundary
        run: ./scripts/audit-private-boundary.sh --enforce-nonapi-imports

      - name: Enforce API pkg/licensing Bridge Boundary
        run: ./scripts/audit-private-boundary.sh --enforce-api-pkg-licensing-imports

      - name: Enforce Paid Surface Allowlist Integrity
        run: ./scripts/audit-private-boundary.sh --enforce-paid-surface-allowlist

      - name: Enforce Paid-Domain Leakage Ratchet
        run: ./scripts/audit-private-boundary.sh --enforce

      - name: Upload Audit Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-boundary-audit
          path: repo-boundary-audit.txt
