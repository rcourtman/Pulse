name: Repo Boundary Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify shared reporting boundary exemption
        run: python3 scripts/repo-boundary-regression.py

      - name: Enforce and report the repository boundary
        id: boundary
        run: |
          set -o pipefail
          ./scripts/audit-private-boundary.sh --enforce 2>&1 | tee repo-boundary-audit.txt

      - name: Upload Audit Report
        if: ${{ !cancelled() && (steps.boundary.outcome == 'success' || steps.boundary.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-boundary-audit
          path: repo-boundary-audit.txt
          if-no-files-found: error
