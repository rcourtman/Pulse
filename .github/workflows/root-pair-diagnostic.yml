name: Root pair diagnostic (not qualification)

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Full reviewed main SHA containing this diagnostic
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: root-pair-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.repository == 'rcourtman/Pulse' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Bind execution to reviewed workflow source
        env:
          EXPECTED_SHA: ${{ inputs.expected_workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Collect fixed exact-pair root evidence
        run: python3 scripts/diagnose-root-pair.py --output root-pair-evidence
      - name: Retain partial or complete diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-pair-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: root-pair-evidence/
          if-no-files-found: warn
          retention-days: 30
