name: Promote Floating Tags
run-name: Promote Floating Tags ${{ inputs.tag }}

# Promotes floating tags for the Pulse server and control-plane images at the
# post-activation promotion barrier. The exact-version images are staged first
# by publish-docker.yml; this workflow is the sole owner of mutable aliases and
# refuses to point them at a draft or quarantined GitHub release.
#
# This mutator is callable only from release-convergence.yml, which owns the
# global customer-promotion lease. A direct dispatch would bypass that lease.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g., v6.0.0). Required for workflow_call."
        required: true
        type: string
      prerelease:
        description: "Is this a prerelease?"
        required: true
        type: boolean
      source_sha:
        description: "Exact source commit asserted by the image provenance."
        required: true
        type: string
      server_digest:
        description: "Activation-committed Pulse server image digest."
        required: true
        type: string
      control_plane_digest:
        description: "Activation-committed Pulse control-plane image digest."
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote-images:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Extract tag from trigger
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="${INPUT_TAG}"
          PRERELEASE="${INPUT_PRERELEASE}"
          if [ -z "$TAG" ]; then
            echo "::error::tag is required"
            exit 1
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "Promoting floating tags for ${TAG} (prerelease: ${PRERELEASE})"

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release line policy
        env:
          TAG: ${{ steps.extract.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_control/validate_artifact_release_line.py \
            --tag "${TAG}" \
            --purpose "floating-tag promotion"

      - name: Require activated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.extract.outputs.tag }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "${TAG}" --json isDraft,publishedAt,tagName \
            --jq '[.tagName, (.isDraft | tostring), (.publishedAt // "")] | @tsv')"
          actual_tag="$(awk -F '\t' '{print $1}' <<<"${release_state}")"
          is_draft="$(awk -F '\t' '{print $2}' <<<"${release_state}")"
          published_at="$(awk -F '\t' '{print $3}' <<<"${release_state}")"
          if [ "${actual_tag}" != "${TAG}" ] || [ "${is_draft}" != "false" ] || [ -z "${published_at}" ]; then
            echo "::error::Floating-tag promotion refuses inactive release ${TAG}."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify activation-committed image identities
        env:
          TAG: ${{ steps.extract.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SERVER_DIGEST: ${{ inputs.server_digest }}
          CONTROL_PLANE_DIGEST: ${{ inputs.control_plane_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_proof="$(printf 'server_digest=%s\ncontrol_plane_digest=%s' \
            "${SERVER_DIGEST}" "${CONTROL_PLANE_DIGEST}")"
          actual_proof="$(./scripts/verify-release-container-images.sh \
            "${TAG}" "${SOURCE_SHA}" "${GITHUB_REPOSITORY}")"
          if [ "${actual_proof}" != "${expected_proof}" ]; then
            echo "::error::Exact-version container identities no longer match the immutable activation marker."
            printf 'Expected:\n%s\nObserved:\n%s\n' "${expected_proof}" "${actual_proof}" >&2
            exit 1
          fi
          echo "[OK] Exact-version tags still resolve to the activation-committed, attested digests."

      - name: Promote Pulse server image tags
        env:
          TAG: ${{ steps.extract.outputs.tag }}
          PRERELEASE: ${{ steps.extract.outputs.prerelease }}
          OWNER: ${{ github.repository_owner }}
          SERVER_DIGEST: ${{ inputs.server_digest }}
          CONTROL_PLANE_DIGEST: ${{ inputs.control_plane_digest }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MINOR=${MINOR:-0}
          MAJOR_MINOR="$MAJOR.$MINOR"

          HIGHEST_STABLE=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          for image in pulse pulse-control-plane; do
            if [ "${image}" = "pulse" ]; then
              expected_digest="${SERVER_DIGEST}"
            else
              expected_digest="${CONTROL_PLANE_DIGEST}"
            fi
            docker_source="docker.io/rcourtman/${image}@${expected_digest}"
            ghcr_source="ghcr.io/${OWNER}/${image}@${expected_digest}"
            docker_targets=()
            ghcr_targets=()
            if [ "$PRERELEASE" = "true" ]; then
              echo "Promoting :rc for ${image} from ${expected_digest}."
              docker_targets+=("rcourtman/${image}:rc")
              ghcr_targets+=("ghcr.io/${OWNER}/${image}:rc")
              docker buildx imagetools create \
                -t "${docker_targets[0]}" \
                "${docker_source}"
              docker buildx imagetools create \
                -t "${ghcr_targets[0]}" \
                "${ghcr_source}"
            else
              docker_targets=(
                "rcourtman/${image}:${MAJOR_MINOR}"
                "rcourtman/${image}:${MAJOR}"
              )
              ghcr_targets=(
                "ghcr.io/${OWNER}/${image}:${MAJOR_MINOR}"
                "ghcr.io/${OWNER}/${image}:${MAJOR}"
              )
              if [ "$TAG" = "$HIGHEST_STABLE" ]; then
                docker_targets+=("rcourtman/${image}:latest")
                ghcr_targets+=("ghcr.io/${OWNER}/${image}:latest")
                echo "Promoting stable aliases for ${image} from ${expected_digest}, including :latest."
              else
                echo "Promoting stable aliases for ${image} from ${expected_digest} without :latest (highest stable is ${HIGHEST_STABLE})."
              fi
              docker_hub_tags=()
              ghcr_tags=()
              for target in "${docker_targets[@]}"; do docker_hub_tags+=(-t "$target"); done
              for target in "${ghcr_targets[@]}"; do ghcr_tags+=(-t "$target"); done
              docker buildx imagetools create \
                "${docker_hub_tags[@]}" \
                "${docker_source}"
              docker buildx imagetools create \
                "${ghcr_tags[@]}" \
                "${ghcr_source}"
            fi

            for target in "${docker_targets[@]}" "${ghcr_targets[@]}"; do
              observed_digest="$(docker buildx imagetools inspect "${target}" \
                --format '{{json .Manifest}}' | jq -er '.digest')"
              if [ "${observed_digest}" != "${expected_digest}" ]; then
                echo "::error::Promoted alias ${target} resolved to ${observed_digest}, expected ${expected_digest}."
                exit 1
              fi
              echo "[OK] ${target} -> ${expected_digest}"
            done
          done

      - name: Promotion summary
        env:
          TAG: ${{ steps.extract.outputs.tag }}
          PRERELEASE: ${{ steps.extract.outputs.prerelease }}
        run: |
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          MAJOR_MINOR="$MAJOR.${MINOR:-0}"

          if [ "$PRERELEASE" = "true" ]; then
            echo "✅ Updated :rc to point to ${TAG} for the server and control-plane images."
          else
            echo "✅ Updated stable floating aliases for the server and control-plane images to ${TAG}."
          fi
          echo "Pulse Agent ships as GitHub Release binaries, not a Docker image."
