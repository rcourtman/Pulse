name: Release Helm Chart to GitHub Pages
run-name: Release Helm Chart ${{ inputs.chart_version }}

# Called explicitly from create-release.yml after the exact Docker image is
# pullable and the GitHub release is activated, or dispatched manually for a
# governed published-release backfill. This workflow mutates the public Pages
# index and must never advertise a draft or quarantined release.
on:
  workflow_call:
    inputs:
      chart_version:
        description: "Chart version (e.g., 6.2.0-rc.9)."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (e.g., 4.28.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Determine chart version
        id: version
        run: |
          VERSION="${{ inputs.chart_version }}"
          if [ -z "$VERSION" ]; then
            echo "::error::chart_version input is required"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart version: $VERSION"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release line policy
        id: release_line
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_control/validate_artifact_release_line.py \
            --tag "${RELEASE_TAG}" \
            --purpose "Helm pages release" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require activated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "${RELEASE_TAG}" --json isDraft,publishedAt,tagName \
            --jq '[.tagName, (.isDraft | tostring), (.publishedAt // "")] | @tsv')"
          actual_tag="$(awk -F '\t' '{print $1}' <<<"${release_state}")"
          is_draft="$(awk -F '\t' '{print $2}' <<<"${release_state}")"
          published_at="$(awk -F '\t' '{print $3}' <<<"${release_state}")"
          if [ "${actual_tag}" != "${RELEASE_TAG}" ] || [ "${is_draft}" != "false" ] || [ -z "${published_at}" ]; then
            echo "::error::Helm Pages refuses to advertise inactive release ${RELEASE_TAG}."
            exit 1
          fi

      - name: Check out validated release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.15.2

      - name: Install helm-docs
        run: |
          cd /tmp
          HELM_DOCS_VERSION="1.14.2"
          HELM_DOCS_ARCHIVE="helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          HELM_DOCS_SHA256="a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc"
          wget "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/${HELM_DOCS_ARCHIVE}"
          printf '%s  %s\n' "$HELM_DOCS_SHA256" "$HELM_DOCS_ARCHIVE" | sha256sum --check --
          tar -xzf "$HELM_DOCS_ARCHIVE"
          sudo mv helm-docs /usr/local/bin/
          helm-docs --version

      - name: Generate chart documentation
        run: |
          set -euo pipefail
          cd deploy/helm/pulse
          helm-docs
          cd ../../..

      - name: Update Chart.yaml version
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python3 scripts/sync_chart_release_metadata.py \
            --chart deploy/helm/pulse/Chart.yaml \
            --version "$VERSION" \
            --repo "${{ github.repository }}"

      - name: Validate Helm chart
        run: |
          # Strict linting
          helm lint deploy/helm/pulse --strict

          # Template validation with minimal values
          helm template pulse deploy/helm/pulse --set persistence.enabled=false > /dev/null

          # Template validation with common overrides
          helm template pulse deploy/helm/pulse \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=pulse.example.com \
            --set agent.enabled=true > /dev/null

          echo "✓ Chart validation passed"

      - name: Smoke test with kind
        run: |
          set -euo pipefail

          cleanup() {
            kind delete cluster --name pulse-test >/dev/null 2>&1 || true
          }

          diagnose() {
            echo "::group::helm status"
            helm status pulse || true
            echo "::endgroup::"

            echo "::group::kubectl get all"
            kubectl get all -A || true
            echo "::endgroup::"

            echo "::group::kubectl describe pods"
            kubectl describe pods -A || true
            echo "::endgroup::"

            echo "::group::pod logs"
            pods=$(kubectl get pods -A -o name 2>/dev/null || true)
            for pod in $pods; do
              echo "### ${pod}"
              kubectl logs --all-containers=true --tail=200 "$pod" || true
            done
            echo "::endgroup::"

            echo "::group::events"
            kubectl get events -A --sort-by=.lastTimestamp || kubectl get events -A || true
            echo "::endgroup::"

            cleanup
          }

          trap 'diagnose' ERR

          # Install kind
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

          # Create cluster
          kind create cluster --name pulse-test --wait 5m

          # Install chart
          helm install pulse deploy/helm/pulse \
            --set persistence.enabled=false \
            --set server.secretEnv.create=true \
            --set server.secretEnv.data.API_TOKENS=test-token \
            --wait --timeout 5m --debug

          # Verify deployment
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=pulse --timeout=180s || (kubectl describe pods -l app.kubernetes.io/name=pulse && exit 1)
          kubectl get pods -l app.kubernetes.io/name=pulse

          # Test upgrade
          helm upgrade pulse deploy/helm/pulse \
            --set persistence.enabled=false \
            --set server.secretEnv.create=true \
            --set server.secretEnv.data.API_TOKENS=test-token \
            --wait --timeout 5m --debug

          # Cleanup
          trap - ERR
          cleanup

          echo "✓ Smoke test passed"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
        with:
          charts_dir: deploy/helm
          config: cr.yaml
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "helm-chart-{{ .Version }}"
          CR_MAKE_RELEASE_LATEST: false

      - name: Ensure chart release and pages index
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail

          CHART="pulse-${VERSION}.tgz"
          CHART_PATH="dist/${CHART}"
          CHART_RELEASE="helm-chart-${VERSION}"
          CHART_RELEASE_URL="https://github.com/${REPOSITORY}/releases/download/${CHART_RELEASE}"
          RELEASE_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"

          mkdir -p dist
          helm package deploy/helm/pulse \
            --version "${VERSION}" \
            --app-version "${VERSION}" \
            --destination dist

          if gh release view "${CHART_RELEASE}" >/dev/null 2>&1; then
            gh release upload "${CHART_RELEASE}" "${CHART_PATH}" --clobber
          else
            gh release create "${CHART_RELEASE}" "${CHART_PATH}" \
              --target "${RELEASE_SHA}" \
              --title "Helm chart ${VERSION}" \
              --notes "Helm chart for Pulse ${VERSION}." \
              --prerelease \
              --latest=false
          fi
          gh release edit "${CHART_RELEASE}" --prerelease --latest=false

          workdir="$(mktemp -d)"
          cleanup() {
            git worktree remove -f "${workdir}/gh-pages" >/dev/null 2>&1 || true
            rm -rf "${workdir}"
          }
          trap cleanup EXIT

          git fetch origin gh-pages
          git worktree add "${workdir}/gh-pages" origin/gh-pages
          git -C "${workdir}/gh-pages" checkout -B gh-pages origin/gh-pages

          index_work="${workdir}/index"
          mkdir -p "${index_work}"
          cp "${CHART_PATH}" "${index_work}/${CHART}"
          if [ -f "${workdir}/gh-pages/index.yaml" ]; then
            cp "${workdir}/gh-pages/index.yaml" "${index_work}/index.yaml"
            helm repo index "${index_work}" \
              --url "${CHART_RELEASE_URL}" \
              --merge "${index_work}/index.yaml"
          else
            helm repo index "${index_work}" --url "${CHART_RELEASE_URL}"
          fi
          cp "${index_work}/index.yaml" "${workdir}/gh-pages/index.yaml"

          if ! grep -q "version: ${VERSION}" "${workdir}/gh-pages/index.yaml"; then
            echo "::error::Helm pages index is missing version ${VERSION}"
            exit 1
          fi

          git -C "${workdir}/gh-pages" add index.yaml
          if git -C "${workdir}/gh-pages" diff --cached --quiet; then
            echo "Helm pages index already contains ${VERSION}"
          else
            git -C "${workdir}/gh-pages" commit -m "Update Helm chart index for ${VERSION}"
            git -C "${workdir}/gh-pages" push origin HEAD:gh-pages
          fi

          public_repo="https://rcourtman.github.io/Pulse"
          public_ready=false
          for attempt in $(seq 1 12); do
            public_index="${workdir}/public-index.yaml"
            if curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
                 -o "$public_index" "${public_repo}/index.yaml" && \
               grep -q "version: ${VERSION}" "$public_index"; then
              helm repo remove pulse-public >/dev/null 2>&1 || true
              helm repo add pulse-public "$public_repo" --force-update
              helm repo update pulse-public
              if helm show chart pulse-public/pulse --version "$VERSION" >/dev/null; then
                public_ready=true
                break
              fi
            fi
            echo "Public Helm repository has not exposed ${VERSION} yet (attempt ${attempt}/12)."
            sleep 5
          done
          if [ "$public_ready" != "true" ]; then
            echo "::error::Public Helm repository did not expose chart ${VERSION}."
            exit 1
          fi
          echo "[OK] Public Helm repository serves pulse ${VERSION}."

      - name: Mark Helm chart release as pre-release (avoid latest override)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="helm-chart-${{ steps.version.outputs.version }}"
          gh release edit "$TAG" --prerelease --latest=false || echo "No helm chart release to edit for $TAG"
