name: Build and Test

on:
  push:
    branches:
      - main
      - pulse/v6-release
  pull_request:
    branches:
      - main
      - pulse/v6-release
  workflow_dispatch:

permissions:
  contents: read

# Let the in-progress run finish (pushes land here every few minutes on a
# busy day, and cancelling would mean main never completes a verdict — four
# consecutive runs were cancelled on 2026-07-17 alone); queued runs collapse
# to the newest pending one, so intermediate pushes skip. Mirrors the Core
# E2E workflow's concurrency policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl -fsSLo "/tmp/${archive}" "$url"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --log-opts=-1 \
            --no-banner \
            --redact \
            --exit-code 2 \
            --report-format sarif \
            --report-path results.sarif

  # The secret scan above runs on every push including docs-only ones — this
  # workflow is the only per-push gitleaks pass, so it must not be path
  # filtered away. The build/test jobs below are gated here instead: a push
  # that touches only docs/ and Markdown skips them entirely. Detection fails
  # open (code=true) whenever the base commit cannot be resolved.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      frontend_deps: ${{ steps.filter.outputs.frontend_deps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "Base commit unavailable; assuming code and dependencies changed."
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "frontend_deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          printf 'Changed files:\n%s\n' "$changed"
          # Note: -q must not be combined with -v here — BSD grep exits 1 for
          # that combination even when inverted matches exist.
          if printf '%s\n' "$changed" | grep -vE '^docs/|\.md$' >/dev/null; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Whether this change moves the frontend dependency graph. It decides
          # what an unreachable npm advisory endpoint means: unknown answer
          # (must block) versus the base commit's already-passing answer. A
          # change to the audit runner itself also demands a real result, so it
          # can never be relaxed under cover of its own tolerant mode.
          if printf '%s\n' "$changed" | grep -qE '^frontend-modern/package(-lock)?\.json$|^scripts/npm-audit-retry\.sh$'; then
            frontend_deps=true
          else
            frontend_deps=false
          fi
          echo "frontend_deps=$frontend_deps" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Everything except the audit runs in ~11m. The audit is now bounded to a
    # 4 minute wall-clock budget, so 30 leaves real headroom while staying a
    # meaningful ceiling: an unbounded 40 would have absorbed the 2026-09-04
    # stall instead of reporting it.
    timeout-minutes: 30
    env:
      FRONTEND_DIR: frontend-modern

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-modern/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-modern
        # The explicit bounded audit below owns the advisory verdict. Avoid
        # npm ci's duplicate best-effort audit POST and its hidden timeout.
        run: npm ci --no-audit

      # npm audit exits 1 both for a real advisory and for an unreachable
      # advisory endpoint. The runner keeps the advisory verdict exactly as
      # strict and only retries the endpoint being down; see the script header.
      #
      # Only the complete graph is audited here. `--omit=dev` audits a subset
      # of these packages, so it can only report a subset of these advisories;
      # and because the complete audit fails the job on any finding, the
      # production step could only ever run in the cases where it was already
      # guaranteed clean. The dev-versus-production split is still reported
      # for every workspace by the scheduled npm-audit job in
      # security-scan.yml, where it informs rather than blocks delivery.
      - name: Audit complete frontend dependency graph
        id: audit-complete
        continue-on-error: true
        working-directory: frontend-modern
        env:
          NPM_AUDIT_REQUIRE_RESULT: ${{ needs.changes.outputs.frontend_deps }}
        run: bash "$GITHUB_WORKSPACE/scripts/npm-audit-retry.sh" all

      # Whole-tree, not staged-only: the pre-commit formatter only ever sees
      # staged files, so drift in untouched files is invisible to it. This is
      # the backstop that keeps `make format` a no-op on a clean tree.
      - name: Check frontend formatting
        working-directory: frontend-modern
        run: npm run format:check

      - name: Lint frontend
        working-directory: frontend-modern
        run: npm run lint

      - name: Audit header composition
        working-directory: frontend-modern
        run: npm run lint:headers

      - name: Check frontend copy-paste duplication
        working-directory: frontend-modern
        run: npm run lint:cpd

      - name: Frontend unit tests
        working-directory: frontend-modern
        run: npm run test

      - name: Type-check frontend
        working-directory: frontend-modern
        run: npm run type-check

      - name: Build frontend bundle (with embed copy)
        run: make frontend

      - name: Check frontend bundle size budget
        working-directory: frontend-modern
        run: npm run check:bundlesize

      # An audit service failure or real advisory stays gating, but it must not
      # suppress formatting, tests, type-checking, or production-build proof.
      - name: Require frontend dependency audit
        if: ${{ !cancelled() }}
        env:
          COMPLETE_AUDIT_RESULT: ${{ steps.audit-complete.outcome }}
        run: |
          if [ "${COMPLETE_AUDIT_RESULT}" != success ]; then
            echo "::error::The frontend dependency audit failed."
            exit 1
          fi

  backend:
    name: Backend tests (${{ matrix.shard }})
    needs: changes
    # Expand every required shard even for documentation-only changes. A
    # job-level condition skips expansion and leaves the named checks pending.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # internal/api is by far the slowest package under -race (~10m), so it
        # gets a dedicated shard; every other package splits across the rest.
        shard: [api, rest-0, rest-1]

    steps:
      - name: Report documentation-only change
        if: needs.changes.outputs.code != 'true'
        run: echo "No backend code changed. Tests are not required for this shard."

      - name: Checkout repository
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # The internal/api package embeds frontend-modern/dist. Unit tests do
      # not assert on real bundle content, so a stub file satisfies the embed
      # without the ~5 minute frontend build; the real bundle is built and
      # size-gated by the frontend job, and release artifacts always build it.
      - name: Provide frontend embed stub
        if: needs.changes.outputs.code == 'true'
        run: |
          mkdir -p internal/api/frontend-modern/dist
          [ -f internal/api/frontend-modern/dist/index.html ] || \
            printf '<!doctype html><title>ci embed stub</title>\n' > internal/api/frontend-modern/dist/index.html

      - name: Go unit tests (shard ${{ matrix.shard }})
        if: needs.changes.outputs.code == 'true'
        env:
          PULSE_DATA_DIR: /tmp/pulse-test-data
        # internal/api alone takes ~22m under -race on a fast machine since
        # the demo estate scaled to 50 nodes, and CI runners have needed
        # roughly double the fast-machine time, hence the large per-binary
        # budget. Remaining packages are split deterministically by list
        # position.
        run: |
          set -euo pipefail
          case "${{ matrix.shard }}" in
            api)    pkgs="./internal/api" ;;
            rest-0) pkgs=$(go list ./... | grep -v '/internal/api$' | awk 'NR % 2 == 0') ;;
            rest-1) pkgs=$(go list ./... | grep -v '/internal/api$' | awk 'NR % 2 == 1') ;;
            *) echo "unknown shard ${{ matrix.shard }}" >&2; exit 1 ;;
          esac
          if [ -z "$pkgs" ]; then
            echo "shard resolved to an empty package list" >&2
            exit 1
          fi
          printf 'Packages in this shard:\n%s\n' "$pkgs"
          go test -race -timeout 50m $pkgs

  scripts-and-build:
    name: Script smoke tests & backend build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # test_gitleaks_ignore.py resolves historical fingerprints against
          # branch- and tag-reachable commits, so it needs full history.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Provide frontend embed stub
        run: |
          mkdir -p internal/api/frontend-modern/dist
          [ -f internal/api/frontend-modern/dist/index.html ] || \
            printf '<!doctype html><title>ci embed stub</title>\n' > internal/api/frontend-modern/dist/index.html

      - name: Script smoke tests
        run: scripts/tests/run.sh

      - name: Build Pulse backend
        run: go build ./cmd/pulse

  benchmarks:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pull request base for paired comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Provide frontend embed stub
        run: |
          mkdir -p internal/api/frontend-modern/dist
          [ -f internal/api/frontend-modern/dist/index.html ] || \
            printf '<!doctype html><title>ci embed stub</title>\n' > internal/api/frontend-modern/dist/index.html
          if [ -d benchmark-base ]; then
            mkdir -p benchmark-base/internal/api/frontend-modern/dist
            [ -f benchmark-base/internal/api/frontend-modern/dist/index.html ] || \
              printf '<!doctype html><title>ci embed stub</title>\n' \
                > benchmark-base/internal/api/frontend-modern/dist/index.html
          fi

      - name: Go benchmarks (non-PR)
        if: github.event_name != 'pull_request'
        timeout-minutes: 15
        env:
          PULSE_BENCH_SAMPLE_COUNT: "10"
        run: bash scripts/run-ci-benchmarks.sh

      - name: Paired base and candidate benchmarks (pull requests)
        if: github.event_name == 'pull_request'
        timeout-minutes: 25
        env:
          PULSE_BENCH_BASELINE_DIR: ${{ github.workspace }}/benchmark-base
          PULSE_BENCH_SAMPLE_COUNT: "10"
        run: bash scripts/run-ci-benchmarks.sh

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260211190930-8161c38c6cdc

      - name: Compare benchmarks against baseline
        if: github.event_name == 'pull_request'
        run: |
          set -eo pipefail
          echo "=== Benchmark comparison (baseline vs current) ==="
          benchstat bench-baseline.txt bench-results.txt | tee bench-comparison.txt
          echo ""
          bash scripts/check-bench-regression.sh bench-comparison.txt

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: |
            bench-results.txt
            bench-baseline.txt
            bench-comparison.txt
          if-no-files-found: warn
          retention-days: 7
